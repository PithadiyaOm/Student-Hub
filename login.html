<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StudentHub - Login</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div id="notification-banner">
        <span>🔔 StudentHub update: Mid-semester examinations begin September 8, 2026.</span>
        <button id="close-banner">&times;</button>
    </div>

    <div class="layout">
        <aside id="sidebar">
            <div class="logo"><h2>STUDENTHUB</h2><p>Student Portal</p></div>
            <nav>
                <a href="home.html">Home</a>
                <a href="dashboard.html">Dashboard</a>
                <a href="events.html">Events</a>
                <a href="profile.html">Profile</a>
                <a href="faq.html">FAQ</a>
                <a href="about.html">About</a>
                <a href="contact.html">Contact</a>
                <a href="feedback.html">Feedback</a>
                <a href="login.html" class="active">Login</a>
                <a href="register.html">Register</a>
                <a href="admin.html">Admin</a>
            </nav>
            <div class="user-profile">
                <p>Om Pithadiya</p><span>om@example.com</span><a href="#">Sign out</a>
            </div>
        </aside>

        <main>
            <div class="top-header">
                <div class="controls">
                    <button id="hamburger-btn">☰ Menu</button>
                    <button id="theme-toggle">🌙 Dark</button>
                </div>
                <div class="breadcrumbs">Home / Login</div>
            </div>

            <p class="breadcrumbs">ACCOUNT</p>
            <h1>Student Login</h1>
            <p class="subtitle">Access your StudentHub account.</p>

            <div class="form-box">
                <form action="#" method="post">
                    <div class="form-group">
                        <label for="email">Email</label>
                        <input type="email" id="email" name="email" required>
                    </div>
                    <div class="form-group">
                        <label for="password">Password</label>
                        <input type="password" id="password" name="password" required>
                    </div>
                    <button type="submit" class="btn">Login</button>
                </form>
            </div>
        </main>
    </div>
    <script src="JS/script.js"></script>
</body>
</html>
