<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StudentHub - FAQ</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="layout">
        <aside id="sidebar">
            <div class="logo"><h2>STUDENTHUB</h2><p>Student Portal</p></div>
            <nav>
                <a href="dashboard.html">Dashboard</a>
                <a href="notices.html">Academic Notices</a>
                <a href="events.html">Campus Events</a>
                <a href="directory.html">Student Directory</a>
                <a href="faq.html" class="active">FAQ</a>
            </nav>
            <div class="user-profile"><p>Om Pithadiya</p><span>om@example.com</span><a href="#">Sign out</a></div>
        </aside>

        <main>
            <div class="top-header">
                <div class="controls"><button id="hamburger-btn">☰ Menu</button><button id="theme-toggle">🌙 Dark</button></div>
                <div class="breadcrumbs">Home / FAQ</div>
            </div>

            <p class="breadcrumbs">HELP</p>
            <h1>Frequently Asked Questions</h1>
            <p class="subtitle">Find answers about academics, StudentHub features and the Practical 6 JSON workflow.</p>

            <div class="card controls-bar">
                <div class="form-group" style="margin-bottom: 0;">
                    <label>Search</label>
                    <input type="text" id="faqSearch" placeholder="Search by question, category or answer">
                </div>
                <div class="form-group" style="margin-bottom: 0;">
                    <label>Filter by category</label>
                    <select id="faqCategory">
                        <option value="All">All categories</option>
                        <option value="Academic">Academic</option>
                        <option value="Events">Events</option>
                        <option value="Student Directory">Student Directory</option>
                        <option value="Notices">Notices</option>
                        <option value="StudentHub">StudentHub</option>
                    </select>
                </div>
            </div>

            <p id="faq-count" class="text-muted" style="margin-bottom: 20px; font-size: 0.9rem;"></p>
            <div id="faq-container" class="grid-2"><p>Loading FAQs...</p></div>
            <div class="pagination" id="faq-pagination" style="display: none;">
                <button id="faqPrev" class="btn btn-secondary" style="width: auto;">Previous</button>
                <span id="faqPageInfo" style="font-weight: 600;">Page 1 of 1</span>
                <button id="faqNext" class="btn" style="width: auto;">Next</button>
            </div>
        </main>
    </div>
    <script src="JS/script.js"></script>
</body>
</html>
